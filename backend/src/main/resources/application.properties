spring.application.name=Logistics-management

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/primeroute_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Configuration
jwt.secret=PrimeRouteLogisticsSecretKey2026ForDevelopmentOnlyChangeThisLater
jwt.expiration=604800000

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@primeroute.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Password Reset Configuration
app.reset-token.expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:15}
app.reset-token.cooldown-minutes=${RESET_TOKEN_COOLDOWN_MINUTES:1}

logging.level.org.springframework.security=DEBUG
